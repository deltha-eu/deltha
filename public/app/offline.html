<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sin conexión · Deltha</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/css/ddd.css">
<style>
  .off { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 12px; }
  .off img { height: 40px; }
  .off .l { display: var(--logo-l); } .off .d { display: var(--logo-d); }
  .off h1 { padding: 0; }
  .off p { color: var(--muted); margin: 0; max-width: 32ch; }
  .off a { border: 1px solid var(--line2); border-radius: 999px; padding: 8px 16px; margin-top: 8px; }
</style>
</head>
<body>
<div class="shell">
  <main class="off">
    <img src="/img/logo.png" alt="" class="l"><img src="/img/logo-dark.png" alt="" class="d">
    <h1>Sin conexión</h1>
    <p>Deltha no guarda nada en tu móvil: las noticias, los votos y los comentarios viven en el servidor. Cuando vuelva la red, sigue por donde ibas.</p>
    <a href="/">Reintentar</a>
  </main>
</div>
</body>
</html>
