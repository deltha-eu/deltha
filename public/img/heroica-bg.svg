<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a33"/><stop offset=".45" stop-color="#070b14"/><stop offset="1" stop-color="#05070d"/></linearGradient>
<radialGradient id="glowc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#35d6ff" stop-opacity=".55"/><stop offset="1" stop-color="#35d6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="glowr" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff1e2d" stop-opacity=".5"/><stop offset="1" stop-color="#ff1e2d" stop-opacity="0"/></radialGradient>
<pattern id="hex" width="28" height="48.5" patternUnits="userSpaceOnUse" patternTransform="scale(1.4)"><path d="M14 0l14 8.1v16.2L14 32.4 0 24.3V8.1zM14 32.4v16.1M0 24.3L-14 32.4M28 24.3l14 8.1" fill="none" stroke="#35d6ff" stroke-opacity=".07" stroke-width=".8"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur2"><feGaussianBlur stdDeviation="1.4"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
