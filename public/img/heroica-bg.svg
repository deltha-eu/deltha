<path d="M0 390h190l30 30" stroke="#35d6ff" stroke-width="2" fill="none"/><path d="M1600 350h-220l-30 30" stroke="#ff1e2d" stroke-width="2" fill="none"/>
<path d="M340 50h920" stroke="#ff1e2d" stroke-width="2" fill="none"/>
