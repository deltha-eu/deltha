# CLA Assistant Lite (20/10/2026): en cada pull request comprueba que quien la abre ha firmado el CLA (CLA.md). Si no, comenta
# pidiendo la frase de firma; cuando la escribe, apunta su usuario en .github/cla-firmas.json de la rama cla-firmas y marca la PR.
# Para que bloquee la fusion, añadir el estado «CLA Assistant Lite» como check obligatorio en el ruleset de main (Settings → Rules).
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'He leído el CLA y lo firmo') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-firmas.json'
          path-to-document: 'https://github.com/deltha-eu/deltha/blob/main/CLA.md'
          branch: 'cla-firmas'
          allowlist: 'imparsifal,dependabot[bot],github-actions[bot]'
          custom-pr-sign-comment: 'He leído el CLA y lo firmo'
          custom-notsigned-prcomment: 'Gracias por la contribución. Para poder fusionarla hace falta firmar el [acuerdo de licencia de contribución (CLA)](https://github.com/deltha-eu/deltha/blob/main/CLA.md): léelo y, si estás de acuerdo, escribe en un comentario exactamente esta frase:'
          custom-allsigned-prcomment: 'Todas las personas que contribuyen a esta pull request han firmado el CLA. Gracias.'
          lock-pullrequest-aftermerge: false
          create-file-commit-message: 'CLA: firma registrada'
          signed-commit-message: 'CLA: $contributorName ha firmado'
